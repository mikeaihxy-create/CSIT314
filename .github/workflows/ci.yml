name: Java CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compile and run all JUnit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate the project root
        run: |
          root=""
          if [ -d "src/main/java" ]; then
            root="."
          else
            java_dir=$(find . -maxdepth 4 -type d -path '*/src/main/java' | head -n 1)
            if [ -n "$java_dir" ]; then
              root="${java_dir%/src/main/java}"
              root="${root#./}"
            fi
          fi
          if [ -z "$root" ]; then
            echo "::error::No Java project (src/main/java) found in the repository."
            exit 1
          fi
          echo "PROJECT_ROOT=$root" >> "$GITHUB_ENV"
          echo "Project root: $root"

      - name: Compile main and test sources
        run: |
          cd "$PROJECT_ROOT"
          mkdir -p build/classes
          count=$(find src/main/java src/test/java -name '*.java' | wc -l)
          find src/main/java src/test/java -name '*.java' -print0 \
            | xargs -0 javac -encoding UTF-8 -nowarn \
                    -d build/classes \
                    -cp "lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar"
          echo "Compiled $count source files."

      - name: Run the full JUnit suite
        run: |
          cd "$PROJECT_ROOT"
          set -o pipefail
          java -Dfile.encoding=UTF-8 \
               -cp "build/classes:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" \
               org.junit.runner.JUnitCore idp.test.AllTests | tee junit.log

      - name: Run the TestRunner driver
        run: |
          cd "$PROJECT_ROOT"
          set -o pipefail
          java -Dfile.encoding=UTF-8 \
               -cp "build/classes:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" \
               idp.test.TestRunner | tee testrunner.log

      - name: Run the boundary demonstration
        run: |
          cd "$PROJECT_ROOT"
          set -o pipefail
          java -Dfile.encoding=UTF-8 \
               -cp "build/classes:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" \
               idp.test.BoundaryDemo | tee boundary-demo.log

      - name: Publish a job summary
        if: always()
        run: |
          cd "${PROJECT_ROOT:-.}"
          {
            echo "## Java CI result"
            echo ""
            echo '```'
            tail -n 20 junit.log 2>/dev/null || echo "junit.log not produced"
            echo '```'
            echo ""
            echo '```'
            tail -n 3 testrunner.log 2>/dev/null || echo "testrunner.log not produced"
            echo '```'
            echo ""
            echo '```'
            tail -n 6 boundary-demo.log 2>/dev/null || echo "boundary-demo.log not produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idp-test-logs
          path: |
            **/junit.log
            **/testrunner.log
            **/boundary-demo.log
          if-no-files-found: warn
